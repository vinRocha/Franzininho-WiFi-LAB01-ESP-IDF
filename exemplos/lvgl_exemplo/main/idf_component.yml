dependencies:
  idf: ">=5.5"

  # LVGL 9.2.x from the Espressif Component Registry.
  # `public: true` lets main and any other component include "lvgl.h".
  lvgl/lvgl:
    version: "~9.5.0"
    public: true

  # Espressif's LVGL port: owns the LVGL task, tick, flush callback and mutex.
  # 2.9.x depends on lvgl >=8,<10, so 9.2.0 resolves cleanly.
  espressif/esp_lvgl_port:
    version: "^2"

  # Uncomment in Module 05 for push-button navigation via the port
  # (lvgl_port_add_navigation_buttons).
  # espressif/button:
  #   version: "^4"
